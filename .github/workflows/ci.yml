# Runs the same gate as local `make check`: ruff + mypy --strict + full pytest,
# with pillow installed so the image tests can't silently skip.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" } # requires-python floor
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" } # the platform saccade actually runs on
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # Before make check, not after: `make check` runs `uv run`, which may
      # rewrite a stale lock, and then this would be checking a file CI just
      # regenerated rather than the one that was committed.
      #
      # Worth checking at all because nothing else does. `uv run` re-resolves and
      # ignores uv.lock, so a green gate says nothing about whether the committed
      # lock installs. It shipped broken once: the stt extra pinned an onnxruntime
      # with no cp310 wheel, which only a user running `uv pip install -e '.[stt]'`
      # would ever hit.
      - name: committed uv.lock resolves for every extra on this Python
        run: uv sync --locked --all-extras --dry-run
      - run: make check
