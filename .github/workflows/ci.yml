# Runs the same gate as local `make check`: ruff + mypy --strict + full pytest,
# with pillow installed so the image tests can't silently skip.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" } # requires-python floor
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" } # the platform saccade actually runs on
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make check
      # `make check` runs through `uv run`, which re-resolves and ignores the
      # committed lock, so a green gate says nothing about whether uv.lock can
      # actually be installed. It shipped broken once: the stt extra locked an
      # onnxruntime with no cp310 wheel, which only a user typing
      # `uv pip install -e '.[stt]'` would ever hit. Resolve every extra against
      # the lock, on the real matrix Python, so that can't happen again.
      - name: uv.lock installs on this Python
        run: uv sync --locked --all-extras --dry-run
