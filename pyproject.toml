[project]
name = "saccade"
version = "0.2.0"
description = "An open harness for proactive ambient agents — peripheral Glance, focused Focus."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eugenio Zuccarelli" }]
keywords = ["ambient-agent", "agents", "vision", "ollama", "gemini", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core runs on the stdlib alone (Ollama backend included)

# Lower bounds only — floors below current stable, so consumers get a working
# API without us dictating their upper range. uv.lock pins dev, not consumers.
[project.optional-dependencies]
gemini = ["google-genai>=1.21.0"]  # response_json_schema landed in 1.21.0; earlier SDKs reject it
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
camera = ["opencv-python-headless>=4.5.0", "pillow>=9.0.0"]
screen = ["mss>=6.0.0", "pillow>=9.0.0"]
audio = ["sounddevice>=0.4.5", "numpy>=1.21"]  # numpy: sounddevice's rec()/play() arrays

[dependency-groups]
# uv run includes this group by default, so `make check` works on a bare
# machine (and in CI) without pillow's image tests silently skipping.
dev = ["ruff", "pytest", "pillow", "mypy"]

[project.urls]
Homepage = "https://github.com/jayzuccarelli/saccade"
Issues = "https://github.com/jayzuccarelli/saccade/issues"

[project.scripts]
saccade = "saccade.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saccade"]

[tool.mypy]
python_version = "3.10"
strict = true
# Optional backends/sensors import third-party libs with no type stubs
# (cv2, sounddevice, google.genai, ...). Treat those as Any rather than vendor stubs.
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format handles line length

[tool.ruff.format]
quote-style = "double"
