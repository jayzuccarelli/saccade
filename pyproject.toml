[project]
name = "saccade"
version = "0.1.1"
description = "An open harness for proactive ambient agents — peripheral Glance, focused Focus."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eugenio Zuccarelli" }]
keywords = ["ambient-agent", "agents", "vision", "ollama", "gemini", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core runs on the stdlib alone (Ollama backend included)

[project.optional-dependencies]
gemini = ["google-genai"]
openai = ["openai"]
anthropic = ["anthropic"]
camera = ["opencv-python-headless", "pillow"]
screen = ["mss", "pillow"]
audio = ["sounddevice"]

[dependency-groups]
# uv run includes this group by default, so `make check` works on a bare
# machine (and in CI) without pillow's image tests silently skipping.
dev = ["ruff", "pytest", "pillow"]

[project.urls]
Homepage = "https://github.com/jayzuccarelli/saccade"
Issues = "https://github.com/jayzuccarelli/saccade/issues"

[project.scripts]
saccade = "saccade.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saccade"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format handles line length

[tool.ruff.format]
quote-style = "double"
